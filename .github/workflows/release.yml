name: release

# Releases are cut manually: Actions → release → "Run workflow" (on master).
# semantic-release then bundles every commit since the last tag into one version.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.release.outputs.new_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - name: Run semantic-release
        id: release
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          npx semantic-release
          NEW_VERSION=$(node -p "require('./package.json').version")
          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "::error::No new release was published (no feat/fix/breaking commits since v$OLD_VERSION)"
            exit 1
          fi
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os:
          - windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.new_version }}
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
