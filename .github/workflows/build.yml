name: build

on:
  push:
    # Renovate only opens a PR once its branch has checks (prCreation:
    # not-pending), so its update branches are checked on push too.
    branches: ["master", "renovate/**"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-26.04
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm run make
